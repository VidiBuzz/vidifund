                    { sym: 'NVDA', name: 'NVIDIA Corp', desc: 'Primary growth contributor to 2025-26 returns.', cap: '$3.54T', perf25: '+138.5%', profit: 'YES', earn: '$28.10', site: 'nvidia.com' },
                    { sym: 'AMZN', name: 'Amazon.com', desc: 'Cloud and consumer services giant.', cap: '$2.1T', perf25: '+31.4%', profit: 'YES', earn: '$4.20', site: 'amazon.com' },
                    { sym: 'GOOGL', name: 'Alphabet Inc.', desc: 'Media, Search, and Cloud services.', cap: '$2.2T', perf25: '+22.5%', profit: 'YES', earn: '$6.80', site: 'google.com' },
                    { sym: 'META', name: 'Meta Platforms', desc: 'Social advertising and AI hardware.', cap: '$1.4T', perf25: '+55.2%', profit: 'YES', earn: '$18.40', site: 'meta.com' },
                    { sym: 'BRK.B', name: 'Berkshire Hathaway', desc: 'Industrial and insurance massive conglomerate.', cap: '$980B', perf25: '+14.2%', profit: 'YES', earn: 'N/A', site: 'berkshirehathaway.com' },
                    { sym: 'LLY', name: 'Eli Lilly', desc: 'Monopolistic medical research leader.', cap: '$840B', perf25: '+68.1%', profit: 'YES', earn: '$12.40', site: 'lilly.com' },
                    { sym: 'AVGO', name: 'Broadcom', desc: 'Backend cloud and enterprise hardware.', cap: '$842B', perf25: '+45.3%', profit: 'YES', earn: '$14.20', site: 'broadcom.com' },
                    { sym: 'JPM', name: 'JPMorgan Chase', desc: 'US financial system leader.', cap: '$582B', perf25: '+14.2%', profit: 'YES', earn: '2.5% Div', site: 'jpmorgan.com' },
                    { sym: 'TSLA', name: 'Tesla Inc.', desc: 'Global EV and AI robotics pioneer.', cap: '$720B', perf25: '-5.4%', profit: 'YES', earn: '$3.10', site: 'tesla.com' },
                    { sym: 'UNH', name: 'UnitedHealth', desc: 'Healthcare delivery and coverage giant.', cap: '$480B', perf25: '+6.5%', profit: 'YES', earn: '$22.10', site: 'unitedhealthgroup.com' },
                    { sym: 'V', name: 'Visa Inc.', desc: 'Global digital payment backbone.', cap: '$565B', perf25: '+16.1%', profit: 'YES', earn: '$9.80', site: 'visa.com' },
                    { sym: 'XOM', name: 'Exxon Mobil', desc: 'Dominant global energy producer.', cap: '$510B', perf25: '+12.4%', profit: 'YES', earn: '3.4% Div', site: 'exxonmobil.com' },
                    { sym: 'HD', name: 'Home Depot', desc: 'US home improvement retail leader.', cap: '$340B', perf25: '+10.2%', profit: 'YES', earn: '2.4% Div', site: 'homedepot.com' },
                    { sym: 'COST', name: 'Costco Wholesale', desc: 'Premier subscription-based retail giant.', cap: '$310B', perf25: '+22.4%', profit: 'YES', earn: '$15.40', site: 'costco.com' }
                ]
            }
        };

        function switchPage(id) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
            if (id === 'summary') renderSummary();
            else renderFund(id);
            window.scrollTo(0,0);
        }

        function renderSummary() {
            let fundCards = Object.values(funds).filter(f => f.symbol !== 'SUMMARY').map(f => `
                <div class="fund-card ${f.isSell ? 'sell-order' : ''}" onclick="switchPage('${f.symbol.toLowerCase()}')">
                    <span class="fund-gain">${f.gain}</span>
                    <h3>${f.symbol}</h3>
                    <div class="fund-tag">${f.name}</div>
                    <div style="font-size:0.75rem; font-weight:900; color:${f.isSell ? '#dc2626' : '#16a34a'}; text-transform:uppercase;">${f.rec}</div>
                </div>
            `).join('');

            getAppRoot().innerHTML = `
                <div class="page active">
                    <section class="order-hero">
                        <div class="hero-left">
                            <h2 class="italic">SELL 90 <br><span>SHARES FCPI</span></h2>
                            <div class="trade-data">
                                <div class="trade-line"><span>Execution Date:</span> <span>March 27, 2026</span></div>
                                <div class="trade-line"><span>Price / Share:</span> <span>$48.24</span></div>
                                <div class="trade-line"><span>Quantity:</span> <span>90.00 Units</span></div>
                                <div class="trade-total"><span>Total Cash:</span> <span>$4,341.60</span></div>
                            </div>
                        </div>
                        <div class="media-stack">
                            <div class="media-box"><h4>Strategy Audio</h4><audio controls><source src="audio_summary.mp3"></audio></div>
                            <div class="media-box"><h4>Market Analysis Video</h4><video controls><source src="strategy_video.mp4"></video></div>
                        </div>
                    </section>
                    <div class="summary-grid">${fundCards}</div>
                </div>
            `;
        }

        function renderFund(id) {
            const f = funds[id];
            const holdings = f.holdings.map(s => {
                const logoPath = `vidifund-media/images/stocks/${s.sym.toLowerCase()}.png`;
                return `
                <div class="stock-card">
                    <div class="stock-header">
                        <img class="company-logo" src="${logoPath}" alt="${s.name} logo" onerror="this.style.display='none'">
                        <div class="stock-title">
                            <a href="https://finance.yahoo.com/quote/${s.sym}" target="_blank" class="ticker-link">${s.sym}</a>
                            <span class="perf-badge ${s.perf25.startsWith('+') ? 'up' : 'down'}">${s.perf25} (2025)</span>
                        </div>
                    </div>
                    <div style="font-size:0.6rem; font-weight:900; color:var(--vidi-green); text-transform:uppercase; margin-bottom:0.5rem;">${s.name}</div>
                    <p class="company-desc">${s.desc}</p>
                    <div class="metric-grid">
                        <div class="met-item"><span>Market Cap</span><strong>${s.cap}</strong></div>
                        <div class="met-item"><span>Profit Status</span><strong>${s.profit}</strong></div>
                        <div class="met-item"><span>Earnings/EPS</span><strong>${s.earn}</strong></div>
                        <div class="met-item"><span>2026 Trend</span><strong style="color:var(--vidi-green)">POSITIVE</strong></div>
                    </div>
                </div>
            `}).join('');

            getAppRoot().innerHTML = `
                <div class="page active">
                    <div style="margin-bottom:2rem; display:flex; justify-content:space-between; align-items:flex-end;">
                        <div>
                            <h2 style="font-size:3.5rem; font-weight:900; letter-spacing:-2px;">${f.name}</h2>
                            <div style="font-weight:900; color:var(--vidi-green); text-transform:uppercase; font-size:0.8rem; margin-top:5px;">Strategy: ${f.rec}</div>
                        </div>
                        <div style="text-align:right">
                            <div style="font-size:0.7rem; font-weight:900; color:var(--text-muted); text-transform:uppercase;">Perf '25-'26</div>
                            <div style="font-size:2rem; font-weight:900; color:var(--vidi-green);">${f.gain}</div>
                        </div>
                    </div>
                    <div class="holdings-grid">${holdings}</div>
                </div>
            `;
        }

        // Initialize Navigation
        const initNav = () => {
            const nav = getNavBar();
            if (!nav) return;
            nav.innerHTML = '';
            Object.keys(funds).forEach(k => {
                const b = document.createElement('button');
                b.className = 'nav-btn';
                b.textContent = funds[k].symbol;
                b.dataset.id = k;
                b.onclick = () => switchPage(k);
                nav.appendChild(b);
            });
        };

        // Start the application
        window.addEventListener('DOMContentLoaded', () => {
            initNav();
            switchPage('summary');
        });
    </script>
</body>
</html>
